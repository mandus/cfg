# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        colors = true
        interval = 7
        output_format = i3bar
}

#order += "ipv6"
order += "disk /"
order += "disk /diska"
order += "disk /diskb"
#order += "run_watch DHCP"
#order += "run_watch VPN"
#
#order += "wireless _first_"
#order += "wireless wlan0"
#order += "wireless wlp58s0"
order += "ethernet _first_"
#order += "ethernet eth0"
#order += "battery 0"
order += "load"
order += "volume master"
order += "tztime local"

wireless _first_ {
        format_up = "⋒ (%quality at %essid) %ip"
        format_down = "⋒ down"
}
wireless wlan0 {
        format_up = "W: (%quality at %essid) %ip"
        format_down = "W: down"
}

wireless wlp58s0 {
# both this and the previous have been replaced with _first_ 
# which is a special "first wifi found"
        format_up = "Wi: (%quality at %essid) %ip"
        format_down = "Wi: down"
}

ethernet _first_ {
        # if you use %speed, i3status requires root privileges
        format_up = "⇅ %ip"
        format_down = "⇅ down"
}

battery 0 {
        format = "%status %percentage %remaining"
        #format_down = "No battery"
        status_chr =  "⚇ "
        status_bat =  "⚡ "
        status_full = "☻ "
        low_threshold = 10
}

run_watch DHCP {
        pidfile = "/var/run/dhclient*.pid"
}

run_watch VPN {
        pidfile = "/var/run/ppp0.pid"
}

tztime local {
        format = "%d.%m.%Y %H:%M"
}

load {
        format = "%1min"
}

disk "/" {
        format = "m: %avail"
}

disk "/diska" {
        format = "a: %avail"
}

disk "/diskb" {
        format = "b: %avail"
}

volume master {
   format = "♪ %volume"
   format_muted = "x(%volume)"
   device = "pulse:alsa_output.pci-0000_00_1f.3.iec958-stereo"
   mixer = "Master"
   mixer_idx = 0
}
